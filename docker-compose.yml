services:
  # The dashboard runs the agents in-process — this single service is the whole app.
  app:
    build: .
    image: ai-business-consultant
    env_file: .env
    command: ["streamlit", "run", "frontend/app.py", "--server.address", "0.0.0.0", "--server.port", "8501", "--server.headless", "true"]
    ports:
      - "8501:8501"

  # Optional REST API for programmatic access:  docker compose --profile api up
  api:
    image: ai-business-consultant
    profiles: ["api"]
    env_file: .env
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
