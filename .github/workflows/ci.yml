name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          # Placeholder so config loads; stage 3 is mocked/skipped in tests
          OPENAI_API_KEY: sk-your-placeholder
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ai-business-consultant .
      - name: Smoke-test API container
        run: |
          docker run -d --name api -p 8000:8000 -e OPENAI_API_KEY=sk-your-placeholder ai-business-consultant
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 2
          done
          echo "backend did not become healthy"; docker logs api; exit 1
